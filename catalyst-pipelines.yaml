# test -> deploy to Development -> smoke test -> human approval -> Production
#
# Nothing reaches Production until a person approves the `approve-production` job.
#
# Pipeline variables (console -> Pipelines -> your pipeline -> Variables; mark the token secret):
#   CATALYST_TOKEN  CLI token             (catalyst token:generate)
#   CATALYST_ORG    org ID
#   PROJECT_ID      project ID
#   REVIEWER_EMAIL  who approves Production
#   DEV_API_URL     https://leaderboard-api-<zaid>.development.catalystappsail.<dc>
#   PROD_API_URL    https://leaderboard-api-<zaid>.catalystappsail.<dc>
version: 1.0

pipeline-when:
  equal:
    - << event.ref >>
    - refs/heads/main

images:
  node:
    image: node:20

jobs:
  test-backend:
    image: node
    steps:
      - cd backend && npm ci && npm test

  test-frontend:
    image: node
    steps:
      - cd frontend && npm ci && npm test && npm run build

  test-fetcher:
    image: node
    steps:
      - cd functions/fetcher && npm ci && npm test

  deploy-dev:
    image: node
    steps:
      - npm i -g zcatalyst-cli
      - echo "VITE_API_BASE=<< env.DEV_API_URL >>" > frontend/.env.production
      - node scripts/relink-slate.js
      - >-
        catalyst deploy --only functions:fetcher
        --project << env.PROJECT_ID >> --org << env.CATALYST_ORG >> --token << env.CATALYST_TOKEN >> -ni
      - >-
        catalyst deploy appsail --name leaderboard-api --build-path backend
        --stack node20 --command "node src/server.js"
        --project << env.PROJECT_ID >> --org << env.CATALYST_ORG >> --token << env.CATALYST_TOKEN >> -ni
      - >-
        catalyst deploy slate leaderboard-web -m "pipeline build"
        --project << env.PROJECT_ID >> --org << env.CATALYST_ORG >> --token << env.CATALYST_TOKEN >> -ni

  smoke-dev:
    image: node
    steps:
      - sh scripts/smoke.sh << env.DEV_API_URL >>

  # One reviewer, no timeout: the run waits here until they approve or reject.
  approve-production:
    type:
      type-name: approval
      type-variables:
        reviewers:
          - << env.REVIEWER_EMAIL >>
        message: Development is deployed and the smoke test passed. Approve to promote to Production.

  # Needs a Production environment created in the console first.
  deploy-prod:
    image: node
    steps:
      - npm i -g zcatalyst-cli
      - echo "VITE_API_BASE=<< env.PROD_API_URL >>" > frontend/.env.production
      - node scripts/relink-slate.js
      - >-
        catalyst deploy --production
        --project << env.PROJECT_ID >> --org << env.CATALYST_ORG >> --token << env.CATALYST_TOKEN >> -ni
      - >-
        catalyst deploy slate leaderboard-web --production -m "pipeline promote"
        --project << env.PROJECT_ID >> --org << env.CATALYST_ORG >> --token << env.CATALYST_TOKEN >> -ni

stages:
  - name: test
    jobs:
      - - test-backend
        - test-frontend
        - test-fetcher
  - name: deploy-dev
    jobs:
      - deploy-dev
  - name: verify
    jobs:
      - smoke-dev
  - name: approval
    jobs:
      - approve-production
  - name: production
    jobs:
      - deploy-prod
